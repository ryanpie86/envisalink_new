# Describes the format for available Envisalink services.

alarm_keypress:
  name: Alarm keypress
  description: Send custom keypresses to the alarm.
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    keypress:
      name: Keypress
      description: "String to send to the alarm panel (1-6 characters)."
      required: true
      example: "*71"
      selector:
        text:

invoke_custom_function:
  name: Invoke custom function
  description: >
    Allows users with DSC panels to trigger a PGM output (1-4).
    Note that you need to specify the alarm panel's "code" parameter for
    this to work.
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    pgm:
      name: PGM
      description: The PGM number to trigger on the alarm panel.
      required: true
      selector:
        number:
          min: 1
          max: 4
    code:
      name: Alarm Code
      description: The alarm code for the selected partition
      required: false
      selector:
        text:

discover_zone_info:
  name: Discover zone info (Honeywell/Vista)
  description: >
    Reads zone names and types directly from the panel's own installer
    programming (*56/*82), the same data an installer would read off a
    physical alpha keypad. Always scans every valid zone number for a
    Vista-20P/15P (1-64), not just the zones already configured
    for this integration -- the point of discovery is finding zones you
    haven't set up yet, so there's nothing to aim it at. This is a
    read-only operation, but it briefly puts the panel into installer
    programming mode, so it requires the partition to be disarmed and
    requires an installer code to be set on this integration's Basic
    options page first. Only available for Honeywell/Vista panels. See
    docs/zone_discovery.md for full details, the exact keystrokes used,
    and its current limitations (e.g. wireless zones are not supported
    yet).
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    apply:
      name: Apply
      description: >
        If true, also write the discovered names/types into this
        integration's configuration (reloading it so the new names take
        effect). If false (default), results are only logged and shown as
        a persistent notification -- nothing is changed. Recommended to
        leave this false the first time so you can review the results.
      required: false
      default: false
      selector:
        boolean:
    remove_unused:
      name: Remove unused zones from existing configuration
      description: >
        If true, also remove any zone that scans back as zone type "00"
        (Not Used) from this integration's configured zone_set (and clear
        its now-orphaned name/type override, if any), so an entity stops
        being created for it. Zones that come back "00" are otherwise left
        untouched even if apply is true -- there's simply nothing to write
        for them. Requires apply: true; there's nothing to remove on a dry
        run.
      required: false
      default: false
      selector:
        boolean:
    include_names:
      name: Include names (*82 alpha descriptors)
      description: >
        If true, also read each zone's *82 alpha descriptor as its name,
        on top of the zone type that's always read. Test with apply:
        false first and compare the notification's raw results against
        what the panel actually shows. If false (default), only zone type
        is read; every result's name stays empty.
      required: false
      default: false
      selector:
        boolean:
    skip_unused_alpha:
      name: Skip alpha read for unused zones
      description: >
        Only relevant when include_names is true. If true (default),
        skips the *82 alpha read for any zone that already came back zone
        type "00" (Not Used) from the *56 walk -- there's no name worth
        reading for a zone that isn't in use, and skipping cuts scan time
        and time spent in installer programming mode. Set to false if you
        specifically want to see a stray leftover descriptor on an unused
        zone, e.g. before deciding whether to remove_unused it.
      required: false
      default: true
      selector:
        boolean:
