# Describes the format for available Envisalink services.

alarm_keypress:
  name: Alarm keypress
  description: Send custom keypresses to the alarm.
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    keypress:
      name: Keypress
      description: "String to send to the alarm panel (1-6 characters)."
      required: true
      example: "*71"
      selector:
        text:

invoke_custom_function:
  name: Invoke custom function
  description: >
    Allows users with DSC panels to trigger a PGM output (1-4).
    Note that you need to specify the alarm panel's "code" parameter for
    this to work.
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    pgm:
      name: PGM
      description: The PGM number to trigger on the alarm panel.
      required: true
      selector:
        number:
          min: 1
          max: 4
    code:
      name: Alarm Code
      description: The alarm code for the selected partition
      required: false
      selector:
        text:

discover_zone_info:
  name: Discover zone info (Honeywell/Vista)
  description: >
    Reads zone names and types directly from the panel's own installer
    programming (*56/*82), the same data an installer would read off a
    physical alpha keypad. Always scans every valid zone number for a
    Vista-20P/15P (1-64 and 91-99), not just the zones already configured
    for this integration -- the point of discovery is finding zones you
    haven't set up yet, so there's nothing to aim it at. This is a
    read-only operation, but it briefly puts the panel into installer
    programming mode, so it requires the partition to be disarmed and
    requires an installer code to be set on this integration's Basic
    options page first. Only available for Honeywell/Vista panels. See
    docs/zone_discovery.md for full details, the exact keystrokes used,
    and its current limitations (e.g. wireless zones are not supported
    yet).
  target:
    entity:
      integration: envisalink_new
      domain: alarm_control_panel
  fields:
    apply:
      name: Apply
      description: >
        If true, also write the discovered names/types into this
        integration's configuration (reloading it so the new names take
        effect). If false (default), results are only logged and shown as
        a persistent notification -- nothing is changed. Recommended to
        leave this false the first time so you can review the results.
      required: false
      default: false
      selector:
        boolean:
